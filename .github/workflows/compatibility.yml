name: Native compatibility
on:
  push:
    paths-ignore: ["**.md", "**.svg"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    name: Format and lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install ruff
        run: python -m pip install ruff==0.17.0
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  native:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
        python: ['3.11', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: FFmpeg Windows
        if: runner.os == 'Windows'
        # Chocolatey's community feed sometimes answers 503; choco then installs nothing and still
        # exits with 0. The script judges by whether ffmpeg and ffprobe can be found, retries, falls
        # back to a checksummed download, and hands the folders of what it found to the next steps.
        run: python scripts/ci_ffmpeg.py
      - name: Tool versions
        # FFmpeg comes from apt, brew, choco or (Windows fallback) a pinned download; this records
        # which one ran.
        # Python looks the tools up the way the program does (shutil.which), not through a bash
        # whose PATH can differ from the one the later steps and the tests see.
        shell: python
        run: |
          import os, shutil, subprocess, sys
          print(sys.version)
          missing = []
          for tool in ('ffmpeg', 'ffprobe'):
              path = shutil.which(tool)
              if not path:
                  missing.append(tool)
                  continue
              lines = subprocess.run([path, '-version'], capture_output=True, text=True).stdout.splitlines()
              print(path, '->', lines[0] if lines else '(no output)')
          if missing:
              print('PATH:', *os.environ['PATH'].split(os.pathsep), sep='\n  ')
              sys.exit('not on PATH: ' + ', '.join(missing))
      - name: Setup
        run: python maintenance.py setup
      - name: Check
        run: python maintenance.py setup --check
      - name: Windows ConPTY test dependency
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m pip install pywinpty==3.0.5
      - name: Tests POSIX
        if: runner.os != 'Windows'
        env:
          YT_TEST_INSTALL: ${{ matrix.python == '3.13' && '1' || '0' }}
        # ci_summary.py names each failing test in an annotation and in the job summary.
        run: python scripts/ci_summary.py --title "Tests ${{ matrix.os }} Python ${{ matrix.python }}" -- .venv/bin/python -m unittest discover -s tests -v
      - name: Tests Windows native
        if: runner.os == 'Windows'
        env:
          YT_TEST_INSTALL: ${{ matrix.python == '3.13' && '1' || '0' }}
        run: python scripts/ci_summary.py --title "Tests ${{ matrix.os }} Python ${{ matrix.python }}" -- .venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Setup diagnostics on failure
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for p in Path('.').glob('.state/setup.log'):
              print(p.read_text(encoding='utf-8',errors='replace'))

  release:
    name: Publish verified stable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os,json; from model import VERSION; assert os.environ['RELEASE_TAG']=='v'+VERSION; assert json.load(open('release.json'))['version']==VERSION"
      - name: Build program-only package
        run: python release_bundle.py dist
      - name: Attest package provenance
        # Ties the package to this workflow, so `update` can prove where it came from. Private
        # repositories need a GitHub plan that offers attestations: where it is not offered this
        # step fails and the release still goes out, as before.
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: a tag pushed again for a release that already exists must not fail,
          # and published assets are never overwritten (installed copies verified against them).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Release already published::$TAG already has a release; existing assets are kept."
            existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for file in dist/*.zip dist/*.sha256; do
              if ! grep -qxF "$(basename "$file")" <<<"$existing"; then
                echo "Uploading missing asset $(basename "$file")"
                gh release upload "$TAG" "$file"
              fi
            done
          else
            gh release create "$TAG" dist/*.zip dist/*.sha256 --verify-tag --title "YouTube Downloader $TAG" --notes "Stable release. All 12 native compatibility jobs passed. Program-only package; settings, cookies, jobs, archives and media are excluded."
          fi
