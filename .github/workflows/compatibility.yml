name: Native compatibility
on:
  push:
    paths-ignore: ["**.md", "**.svg"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    name: Format and lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install ruff
        run: python -m pip install ruff==0.17.0
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  native:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
        python: ['3.10', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: FFmpeg Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg --yes --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw 'FFmpeg installation failed after retries' }
              Start-Sleep -Seconds 5
            }
          }
          Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'
      - name: Setup
        run: python maintenance.py setup
      - name: Check
        run: python maintenance.py setup --check
      - name: Windows ConPTY test dependency
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m pip install pywinpty==3.0.5
      - name: Tests POSIX
        if: runner.os != 'Windows'
        env:
          YT_TEST_INSTALL: ${{ matrix.python == '3.13' && '1' || '0' }}
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Tests Windows native
        if: runner.os == 'Windows'
        env:
          YT_TEST_INSTALL: ${{ matrix.python == '3.13' && '1' || '0' }}
        run: .venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Setup diagnostics on failure
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for p in Path('.').glob('.state/setup.log'):
              print(p.read_text(encoding='utf-8',errors='replace'))

  release:
    name: Publish verified stable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os,json; from model import VERSION; assert os.environ['RELEASE_TAG']=='v'+VERSION; assert json.load(open('release.json'))['version']==VERSION"
      - name: Build program-only package
        run: python release_bundle.py dist
      - name: Publish package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: a tag pushed again for a release that already exists must not fail,
          # and published assets are never overwritten (installed copies verified against them).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Release already published::$TAG already has a release; existing assets are kept."
            existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for file in dist/*.zip dist/*.sha256; do
              if ! grep -qxF "$(basename "$file")" <<<"$existing"; then
                echo "Uploading missing asset $(basename "$file")"
                gh release upload "$TAG" "$file"
              fi
            done
          else
            gh release create "$TAG" dist/*.zip dist/*.sha256 --verify-tag --title "YouTube Downloader $TAG" --notes "Stable release. All 12 native compatibility jobs passed. Program-only package; settings, cookies, jobs, archives and media are excluded."
          fi
