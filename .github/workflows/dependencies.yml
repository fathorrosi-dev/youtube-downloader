name: Dependency health

# Weekly check of what compatibility.yml never looks at: whether the hash-locked packages
# still match PyPI, whether any of them has a known vulnerability, and whether the yt-dlp pin is
# old while a newer yt-dlp exists. (bump-ytdlp.yml prepares the pull request for that bump.)
# It runs only in CI and adds nothing to the tool. A problem opens (or updates) one issue.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Lock, vulnerabilities and yt-dlp age
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Lock hashes match PyPI
        id: lock
        continue-on-error: true
        run: python scripts/lock_hashes.py --check 2>&1 | tee lock.txt; test "${PIPESTATUS[0]}" -eq 0
      - name: Known vulnerabilities in the locked packages
        id: audit
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit==2.9.0
          python -m pip_audit --requirement requirements.lock --no-deps --disable-pip 2>&1 | tee audit.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: yt-dlp pin is old and a newer release exists
        id: age
        continue-on-error: true
        # pipefail: without it the exit code of the check is lost behind `tee` and the step never fails.
        run: |
          set -o pipefail
          python scripts/pin_status.py --check 2>&1 | tee age.txt
      - name: Open an issue when something needs attention
        if: steps.lock.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.age.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Dependency health: action needed"
          {
            echo "The weekly dependency check found something. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for part in lock audit age; do
              if [ -s "$part.txt" ]; then echo; echo "### $part"; echo '```'; tail -n 40 "$part.txt"; echo '```'; fi
            done
          } > body.md
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
